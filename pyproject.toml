[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ledger-sense"
version = "0.1.0"
description = "Ledger Sense — an autonomous office of the CFO that learns an organization's recurring exception-resolution patterns."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
ledger-sense-generate = "ledger_sense.data.cli:main"
ledger_sense = "ledger_sense.learning.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: full pass-1/pass-2 pipeline tests that shell out to Agent 1/2's real CLIs"]
